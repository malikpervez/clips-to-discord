name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Build with warnings as errors
        run: dotnet build .\ClipsToDiscord.csproj -c Release -warnaserror

      - name: Run smoke tests
        run: dotnet run --project .\tests\ClipsToDiscord.SmokeTests\ClipsToDiscord.SmokeTests.csproj -c Release

      - name: Build portable package layout
        shell: powershell
        run: |
          $ffmpegDirectory = .\scripts\get-ffmpeg.ps1
          .\scripts\package.ps1 `
            -FfmpegPath (Join-Path $ffmpegDirectory 'ffmpeg.exe') `
            -FfmpegLicensePath (Join-Path $ffmpegDirectory 'FFMPEG-LICENSE.txt')

      - name: Download verified previous installer
        shell: powershell
        run: |
          $previousDirectory = '.\artifacts\previous-installer'
          [IO.Directory]::CreateDirectory($previousDirectory) | Out-Null
          $previousInstaller = Join-Path $previousDirectory 'ClipsToDiscord-Setup.exe'
          Invoke-WebRequest `
            -Uri 'https://github.com/malikpervez/clips-to-discord/releases/download/v1.3.5/ClipsToDiscord-Setup.exe' `
            -OutFile $previousInstaller `
            -MaximumRedirection 5 `
            -UseBasicParsing
          $expectedSha256 = 'F9158ABE17D458C91A6955A0487093290E4CCEB3DC79B90FDF9CF19AF3A967DB'
          $actualSha256 = (Get-FileHash -LiteralPath $previousInstaller -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "Previous installer checksum mismatch. Expected $expectedSha256, got $actualSha256."
          }

      - name: Build installer
        shell: powershell
        run: |
          $isccPath = .\scripts\get-inno-setup.ps1
          .\scripts\build-installer.ps1 -IsccPath $isccPath -RequireFfmpeg

      - name: Verify application and installer icons
        shell: powershell
        run: |
          .\scripts\test-icons.ps1 `
            -ApplicationPath .\artifacts\ClipCord-win-x64\ClipsToDiscord.exe `
            -InstallerPath .\artifacts\ClipCord-Setup.exe `
            -IconPath .\assets\ClipsToDiscord.ico

      - name: Reject tampered compiler cache
        shell: powershell
        run: |
          $tamperedDirectory = Join-Path $env:RUNNER_TEMP 'TamperedInnoSetup'
          Copy-Item `
            -LiteralPath .\artifacts\tools\InnoSetup `
            -Destination $tamperedDirectory `
            -Recurse
          Add-Content `
            -LiteralPath (Join-Path $tamperedDirectory 'ISCC.exe') `
            -Value 'tampered'
          $rejected = $false
          try {
            .\scripts\get-inno-setup.ps1 -DestinationDirectory $tamperedDirectory
          }
          catch {
            if ($_.Exception.Message -notlike '*compiler integrity check failed*') {
              throw
            }
            $rejected = $true
          }
          if (-not $rejected) {
            throw 'The tampered compiler cache was accepted.'
          }

      - name: Reject tampered FFmpeg cache
        shell: powershell
        run: |
          $tamperedDirectory = Join-Path $env:RUNNER_TEMP 'TamperedFfmpeg'
          Copy-Item `
            -LiteralPath .\artifacts\tools\FFmpeg-8.1.2 `
            -Destination $tamperedDirectory `
            -Recurse
          Add-Content `
            -LiteralPath (Join-Path $tamperedDirectory 'ffmpeg.exe') `
            -Value 'tampered'
          $rejected = $false
          try {
            .\scripts\get-ffmpeg.ps1 -DestinationDirectory $tamperedDirectory
          }
          catch {
            if ($_.Exception.Message -notlike '*integrity check failed*') {
              throw
            }
            $rejected = $true
          }
          if (-not $rejected) {
            throw 'The tampered FFmpeg cache was accepted.'
          }

      - name: Reject unexpected package files
        shell: powershell
        run: |
          $unexpectedFile = '.\artifacts\ClipCord-win-x64\settings.json'
          Set-Content -LiteralPath $unexpectedFile -Value '{"mustNotShip":true}'
          $rejected = $false
          try {
            .\scripts\build-installer.ps1 `
              -IsccPath .\artifacts\tools\InnoSetup\ISCC.exe
          }
          catch {
            if ($_.Exception.Message -notlike '*unexpected or unsafe items*') {
              throw
            }
            $rejected = $true
          }
          finally {
            Remove-Item -LiteralPath $unexpectedFile -Force
          }
          if (-not $rejected) {
            throw 'An unexpected settings.json file was accepted for packaging.'
          }

      - name: Test install, upgrade, mutex, in-app restart, and uninstall
        shell: powershell
        run: |
          .\scripts\test-installer.ps1 `
            -InstallerPath .\artifacts\ClipCord-Setup.exe `
            -PreviousInstallerPath .\artifacts\previous-installer\ClipsToDiscord-Setup.exe `
            -ExpectedVersion 1.5.0 `
            -PreviousVersion 1.3.5

      - name: Create legacy updater alias
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: Copy-Item -LiteralPath '.\artifacts\ClipCord-Setup.exe' -Destination '.\artifacts\ClipsToDiscord-Setup.exe'

      - name: Prepare release checksums
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $lines = @(
            'ClipCord-Setup.exe',
            'ClipsToDiscord-Setup.exe',
            'ClipCord-win-x64.zip'
          ) | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath (Join-Path '.\artifacts' $_) -Algorithm SHA256).Hash
            "$hash  $_"
          }
          Set-Content -LiteralPath '.\artifacts\SHA256SUMS.txt' -Value $lines -Encoding Ascii

      - name: Upload verified release candidates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ClipCord-release-${{ github.sha }}
          path: |
            artifacts/ClipCord-Setup.exe
            artifacts/ClipsToDiscord-Setup.exe
            artifacts/ClipCord-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
